<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Text Summarizer</title>

    <meta
        name="description"
        content="Summarize long text quickly and accurately using AI."
    >

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <main class="container">

        <!-- Header -->
        <header class="hero">
            <div class="logo">✦</div>

            <h1>AI Text Summarizer</h1>

            <p>
                Turn long text into clear, concise summaries
                powered by artificial intelligence.
            </p>
        </header>


        <!-- Input -->
        <section class="card">

            <div class="section-header">
                <div>
                    <h2>Enter your text</h2>
                    <span id="wordCount">0 words</span>
                </div>
            </div>

            <textarea
                id="textInput"
                placeholder="Paste your article, notes, paragraph, or any long text here..."
            ></textarea>


            <!-- Options -->
            <div class="controls">

                <div class="option-group">

                    <label for="summaryLength">
                        Summary length
                    </label>

                    <select id="summaryLength">
                        <option value="short">Short</option>
                        <option value="medium" selected>Medium</option>
                        <option value="detailed">Detailed</option>
                    </select>

                </div>


                <div class="option-group">

                    <label for="summaryFormat">
                        Format
                    </label>

                    <select id="summaryFormat">
                        <option value="paragraph" selected>
                            Paragraph
                        </option>

                        <option value="bullets">
                            Bullet Points
                        </option>
                    </select>

                </div>


                <button id="summarizeBtn">
                    ✨ Summarize
                </button>

            </div>

        </section>


        <!-- Loading -->
        <div id="loading" class="loading hidden">

            <div class="spinner"></div>

            <span>
                AI is creating your summary...
            </span>

        </div>


        <!-- Result -->
        <section class="card result-card">

            <div class="result-header">

                <div>

                    <span class="result-label">
                        AI GENERATED
                    </span>

                    <h2>🤖 Summary</h2>

                </div>

                <button id="copyBtn" class="secondary-btn">
                    📋 Copy
                </button>

            </div>


            <div id="summary" class="summary">

                <p class="placeholder">
                    Your AI-generated summary will appear here.
                </p>

            </div>

        </section>


        <!-- Footer -->
        <footer>

            <p>
                Built with Python, FastAPI & Groq AI
            </p>

        </footer>

    </main>


    <script src="/static/script.js"></script>

</body>
</html>
